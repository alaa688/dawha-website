<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>مقتطفات من العام الماضي</title>
  <style>
    body {
      font-family: "Tahoma", sans-serif;
      background-color: #fff;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    h2 {
      color: #556b2f;
      margin-bottom: 20px;
    }

    .media {
      margin: 20px 0;
    }

    img {
      max-width: 90%;
      height: auto;
      margin: 15px 0;
      border: 4px solid #d4af37;
      border-radius: 10px;
    }

    video {
      max-width: 90%;
      margin: 15px 0;
      border: 4px solid #556b2f;
      border-radius: 10px;
    }

    iframe {
      max-width: 90%;
      margin: 15px 0;
      border: 4px solid #556b2f;
      border-radius: 10px;
    }

    a.back {
      display: inline-block;
      margin-top: 30px;
      padding: 12px 25px;
      background: #556b2f;
      color: #fff;
      border-radius: 10px;
      text-decoration: none;
      font-size: 16px;
    }

    a.back:hover {
      background: #d4af37;
      color: #000;
    }
  </style>
</head>
<body>

  <h2>📸 مقتطفات من العام الماضي</h2>
  
  <!-- صور -->
  <div class="media">
    <img src="pic1.jpg.jpeg" alt="صورة 1">
  </div>
  <div class="media">
    <img src="pic2.jpg.jpeg" alt="صورة 2">
  </div>
<div class="media">
    <img src="pic4.jpg.jpeg" alt="صورة 3">
  </div>
  <!-- فيديو mp4 -->
  <div class="media">
    <video controls>
      <source src="video.mp4.mp4" type="video/mp4">
      المتصفح لا يدعم تشغيل الفيديو
    </video>
  </div>



  <a href="index.html" class="back">⬅ العودة إلى الصفحة الرئيسية</a>

</body>
</html>
